<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Titan Builder</title><desc id="desc">A guarded local development harness banner showing project context, typed operations, approval, safe runtime, and verification.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171c2a"/><stop offset="1" stop-color="#4e5e93"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern><style>.t{font:700 45px Segoe UI,Arial;fill:#f7f8ff}.s{font:600 15px Segoe UI,Arial;letter-spacing:2.4px;fill:#e0e8ff}.e{font:700 12px Segoe UI,Arial;letter-spacing:2.3px;fill:#ffcd7c}.l{font:700 12px Segoe UI,Arial;fill:#fff}.q{font:400 11px Segoe UI,Arial;fill:#c7d4ee}</style></defs><rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/><circle cx="1090" cy="35" r="220" fill="#ffcc78" opacity=".12"/><text x="70" y="66" class="e">TITAN BUILDER � LOCAL DEVELOPMENT HARNESS � SAFETY FIRST</text><text x="70" y="125" class="t">Titan Builder</text><text x="72" y="160" class="s">CONTEXT    TYPED OPS    APPROVAL    SAFE RUNTIME    VERIFY</text><path d="M110 245H1090" stroke="#7189ba" stroke-width="2"/><path d="M144 245H1050" stroke="#ffcd7c" stroke-width="3"/><g><circle cx="144" cy="245" r="24" fill="#354878" stroke="#ffcd7c" stroke-width="2"/><text x="144" y="250" text-anchor="middle" class="l">01</text><text x="144" y="292" text-anchor="middle" class="l">Context</text><text x="144" y="312" text-anchor="middle" class="q">project + memory</text><circle cx="383" cy="245" r="24" fill="#354878" stroke="#ffcd7c" stroke-width="2"/><text x="383" y="250" text-anchor="middle" class="l">02</text><text x="383" y="292" text-anchor="middle" class="l">Typed ops</text><text x="383" y="312" text-anchor="middle" class="q">Zod + previews</text><circle cx="622" cy="245" r="24" fill="#354878" stroke="#ffcd7c" stroke-width="2"/><text x="622" y="250" text-anchor="middle" class="l">03</text><text x="622" y="292" text-anchor="middle" class="l">Approval</text><text x="622" y="312" text-anchor="middle" class="q">risk boundary</text><circle cx="861" cy="245" r="24" fill="#354878" stroke="#ffcd7c" stroke-width="2"/><text x="861" y="250" text-anchor="middle" class="l">04</text><text x="861" y="292" text-anchor="middle" class="l">Bridge</text><text x="861" y="312" text-anchor="middle" class="q">local execution</text><circle cx="1050" cy="245" r="24" fill="#345b58" stroke="#a8e7ff" stroke-width="2"/><text x="1050" y="250" text-anchor="middle" class="l">05</text><text x="1050" y="292" text-anchor="middle" class="l">Verify</text><text x="1050" y="312" text-anchor="middle" class="q">evidence + recovery</text></g><text x="70" y="342" class="q">AI-assisted development with repository authority and path safety kept explicit</text></svg>

