<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">Titan Builder architecture</title><desc id="desc">Developer input passes through the CLI, project context, Fastify local bridge, persistent browser jobs, typed operations, approval, safe tools, repository, and verification profiles.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171c2a"/><stop offset="1" stop-color="#4e5e93"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#ffcd7c"/></marker><style>.e{font:700 13px Segoe UI,Arial;letter-spacing:2px;fill:#ffcd7c}.t{font:700 32px Segoe UI,Arial;fill:#f7f8ff}.s{font:400 15px Segoe UI,Arial;fill:#e0e8ff}.n{fill:#2d3d6b;stroke:#6f89bc;stroke-width:2}.g{fill:#3f4f82;stroke:#ffcd7c;stroke-width:2}.y{fill:#345b58;stroke:#a8e7ff;stroke-width:2}.l{font:700 16px Segoe UI,Arial;fill:#fff}.b{font:400 13px Segoe UI,Arial;fill:#d8e2f6}.q{font:400 12px Segoe UI,Arial;fill:#c1cfe7}.r{stroke:#ffcd7c;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="26" fill="url(#bg)"/><text x="64" y="58" class="e">TITAN BUILDER � REPOSITORY-AWARE EXECUTION MAP</text><text x="64" y="106" class="t">Typed operations cross a guarded local boundary</text><text x="64" y="136" class="s">Source-backed from src/, browser-extension/, package.json, and the documented CLI/bridge flow.</text><rect x="70" y="220" width="250" height="130" rx="16" class="n"/><text x="195" y="260" text-anchor="middle" class="l">Developer + CLI</text><text x="195" y="290" text-anchor="middle" class="b">prompt + active project</text><text x="195" y="318" text-anchor="middle" class="q">context + memory</text><path d="M320 285H430" class="r"/><rect x="430" y="220" width="250" height="130" rx="16" class="g"/><text x="555" y="260" text-anchor="middle" class="l">Fastify local bridge</text><text x="555" y="290" text-anchor="middle" class="b">auth + persistent jobs</text><text x="555" y="318" text-anchor="middle" class="q">browser extension route</text><path d="M680 285H790" class="r"/><rect x="790" y="220" width="250" height="130" rx="16" class="g"/><text x="915" y="260" text-anchor="middle" class="l">Typed operation planner</text><text x="915" y="290" text-anchor="middle" class="b">diff + risk summary</text><text x="915" y="318" text-anchor="middle" class="q">validated file/tool ops</text><path d="M1040 285H1150" class="r"/><rect x="1150" y="220" width="280" height="130" rx="16" class="y"/><text x="1290" y="260" text-anchor="middle" class="l">Approval + safe runtime</text><text x="1290" y="290" text-anchor="middle" class="b">path/VCS boundaries</text><text x="1290" y="318" text-anchor="middle" class="q">local tools only when approved</text><path d="M1290 350V500H1050" class="r"/><rect x="700" y="520" width="650" height="92" rx="16" class="n"/><text x="1025" y="557" text-anchor="middle" class="l">Repository  verification profiles  evidence</text><text x="1025" y="584" text-anchor="middle" class="q">build/test checks, recovery, and persisted run status</text></svg>

