name: Integrate issue 223 transport

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out issue branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/issue-223-connection-bound-bridge-auth
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install companion dependencies
        working-directory: browser-extension
        run: pnpm install --frozen-lockfile

      - name: Wire same-connection transport into production
        run: python .github/issue223/integrate.py

      - name: Verify companion on Linux
        working-directory: browser-extension
        run: pnpm run verify

      - name: Verify root integration
        run: |
          pnpm run typecheck
          pnpm run test:node
          pnpm run build
          pnpm run check:extension

      - name: Publish verified integration and remove executor
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf .github/issue223 .github/workflows/issue-223-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(security): bind bridge authorization to verified connection (#223)'
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:fix/issue-223-connection-bound-bridge-auth
