name: Apply current-main source repair

on:
  push:
    branches:
      - fix/current-main-verification-regressions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/current-main-verification-regressions
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Apply coherent verified source slices
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git show 4ee7a97d554bd4986a74519330ad5286e60ab3b4:src/context/directory-tree.ts > src/context/directory-tree.ts
          git show 4ee7a97d554bd4986a74519330ad5286e60ab3b4:src/context/file-context.ts > src/context/file-context.ts
          git show 7262c837bd753a38f3d83492b187b10487ea07d0:src/operations/index.ts > src/operations/index.ts
          git show 7262c837bd753a38f3d83492b187b10487ea07d0:src/security/project-path.ts > src/security/project-path.ts
          git show 6b2e61a73313b9b4381d89fcd86dcec6f1aa9562:src/skills/dispatcher.ts > src/skills/dispatcher.ts
          git show ea3f60efede32227f7bbe93b32455e99fbfc4633:src/tools/registry.ts > src/tools/registry.ts

          python - <<'PY'
          from pathlib import Path

          doctor = Path('src/diagnostics/install-doctor.ts')
          text = doctor.read_text(encoding='utf-8')
          old = """        values: Object.fromEntries(
          Object.entries(input.env).filter(([, value]) => value !== undefined && value !== null),
        ),"""
          new = """        values: Object.fromEntries(
          Object.entries(input.env)
            .filter((entry): entry is [string, string] => entry[1] !== undefined && entry[1] !== null),
        ),"""
          if old in text:
              text = text.replace(old, new, 1)
          doctor.write_text(text, encoding='utf-8')

          routes = Path('src/server/browser-workflow-routes.ts')
          text = routes.read_text(encoding='utf-8')
          marker = "import { listToolManifests } from '../tools/registry.js';\n"
          if "import { logger } from '../shared/index.js';" not in text:
              text = text.replace(marker, marker + "import { logger } from '../shared/index.js';\n", 1)
          text = text.replace(
              "logger.warn('SSE update fetch failed', { runId, error });",
              "logger.warn({ runId, error }, 'SSE update fetch failed');",
          )
          routes.write_text(text, encoding='utf-8')

          server = Path('src/server/index.ts')
          text = server.read_text(encoding='utf-8')
          text = text.replace(
              "import { createBridgeIdentityProof } from './bridge-identity.js';",
              "import { createBridgeIdentityResponse, isValidBridgeIdentityChallenge } from './bridge-identity.js';",
          )
          if 'const MAX_RESPONSE_BYTES =' not in text:
              text = text.replace(
                  "const PORT = Number(process.env.PORT ?? 5000);",
                  "const PORT = Number(process.env.PORT ?? 5000);\nconst MAX_RESPONSE_BYTES = 10 * 1024 * 1024;",
                  1,
              )
          text = text.replace(
              "app.post('/operations/preview', bridgeBodyLimit('/operations/preview'), async (request) => {",
              "app.post('/operations/preview', bridgeBodyLimit('/operations/preview'), async (request, reply) => {",
              1,
          )
          server.write_text(text, encoding='utf-8')

          session = Path('src/server/session-store.ts')
          text = session.read_text(encoding='utf-8')
          marker = "let persistenceStore: PersistentSessionStore | undefined;\n"
          if 'export async function initializeSessionStore' not in text:
              addition = r'''
let persistenceWrite: Promise<void> = Promise.resolve();

export async function initializeSessionStore(
  store: PersistentSessionStore,
): Promise<{ recovered: number }> {
  persistenceStore = store;
  const loaded = store.pruneByPolicy(await store.loadSessions());
  sessions.clear();
  for (const session of loaded) {
    if (session.status === 'claimed') {
      session.status = 'pending';
      clearClaim(session);
    }
    sessions.set(session.id, session);
  }
  await store.saveSessions([...sessions.values()]);
  return { recovered: sessions.size };
}

function persistSessions(): Promise<void> {
  const store = persistenceStore;
  if (!store) return Promise.resolve();
  persistenceWrite = persistenceWrite.then(async () => {
    const retained = store.pruneByPolicy([...sessions.values()]);
    sessions.clear();
    for (const session of retained) sessions.set(session.id, session);
    await store.saveSessions(retained);
  });
  return persistenceWrite;
}
'''
              text = text.replace(marker, marker + addition, 1)
          session.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/repair-current-main-source.yml
          rm -f .github/workflows/repair-current-main-source-push.yml
          git diff --check
      - name: Capture typecheck evidence
        shell: bash
        run: |
          set +e
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm install --frozen-lockfile > /tmp/install.log 2>&1
          install_status=$?
          if [ "$install_status" -eq 0 ]; then
            pnpm run typecheck > /tmp/typecheck.log 2>&1
            typecheck_status=$?
          else
            typecheck_status=99
          fi
          {
            echo '# Current-main source repair evidence'
            echo
            echo "Install exit: $install_status"
            echo "Typecheck exit: $typecheck_status"
            echo
            echo '## Install output'
            echo '```text'
            cat /tmp/install.log
            echo '```'
            echo
            echo '## Typecheck output'
            echo '```text'
            if [ -f /tmp/typecheck.log ]; then cat /tmp/typecheck.log; fi
            echo '```'
          } > docs/current-main-source-repair-evidence.md
      - name: Publish repair candidate
        shell: bash
        run: |
          git add -A
          git commit -m "fix(ci): reconstruct coherent current-main source"
          git push origin HEAD:fix/current-main-verification-regressions
