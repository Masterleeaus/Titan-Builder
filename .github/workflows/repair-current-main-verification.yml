name: Repair current main verification

on:
  push:
    branches:
      - fix/current-main-verification-regressions

permissions:
  contents: write

concurrency:
  group: repair-current-main-verification
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: fix/current-main-verification-regressions

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Regenerate and verify root lockfile
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Remove one-shot controller and publish repair
        shell: bash
        run: |
          rm -f .github/workflows/repair-current-main-verification.yml
          git config user.name "titan-builder-agent"
          git config user.email "titan-builder-agent@users.noreply.github.com"
          git add package.json pnpm-lock.yaml .github/workflows
          if git diff --cached --quiet; then
            echo "No repair changes to publish"
            exit 0
          fi
          git commit -m "fix(ci): restore package, lockfile, and workflow policy"
          git push origin HEAD:fix/current-main-verification-regressions
