name: Apply issue 148 fix

on:
  push:
    branches:
      - fix/148-loopback-bridge-identity
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: issue-148-loopback-bridge-identity
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Install companion dependencies
        run: pnpm --dir browser-extension install --frozen-lockfile

      - name: Materialize issue patch runner
        env:
          PATCH_PAYLOAD: ''
        run: |
          printf '%s' "$PATCH_PAYLOAD" | base64 --decode | gzip --decompress > /tmp/issue-148-apply.mjs
          node --check /tmp/issue-148-apply.mjs

      - name: Add failing regression tests
        run: node /tmp/issue-148-apply.mjs tests

      - name: Verify regression tests fail before implementation
        shell: bash
        run: |
          set +e
          node --experimental-strip-types --test src/server/security.test.ts > /tmp/root-red.log 2>&1
          root_status=$?
          pnpm --dir browser-extension exec vitest run bridge-server.test.ts > /tmp/companion-red.log 2>&1
          companion_status=$?
          set -e
          cat /tmp/root-red.log
          cat /tmp/companion-red.log
          test "$root_status" -ne 0
          test "$companion_status" -ne 0
          grep -Eq "bridge identity proof|bridge health proves" /tmp/root-red.log
          grep -Eq "verified bridge forwarding|ISSUE_148_NOT_IMPLEMENTED" /tmp/companion-red.log

      - name: Implement verified loopback bridge forwarding
        run: node /tmp/issue-148-apply.mjs implementation

      - name: Run focused regression tests
        run: |
          node --experimental-strip-types --test src/server/security.test.ts
          pnpm --dir browser-extension exec vitest run bridge-server.test.ts

      - name: Run complete root verification
        run: pnpm run verify

      - name: Run complete companion verification
        run: pnpm --dir browser-extension run verify

      - name: Check patch integrity
        run: git diff --check

      - name: Remove temporary automation and publish verified fix
        shell: bash
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          node /tmp/issue-148-apply.mjs cleanup
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: secure companion bridge forwarding (#148)"
          auth_header=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" push origin HEAD:fix/148-loopback-bridge-identity
