      - name: Verify companion fix
        working-directory: browser-extension
        run: pnpm run verify

      - name: Verify root security and build
        run: |
          pnpm run typecheck
          pnpm run test:node
          pnpm run build

      - name: Publish implementation commit and remove runner
        run: |
          rm .github/workflows/issue-148-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser-extension/bridge-server.ts browser-extension/bridge-server.test.ts browser-extension/bridge-target-security.ts src/server/index.ts src/server/security.ts src/server/security.test.ts .github/workflows/issue-148-apply.yml
          git commit -m 'fix: authenticate loopback bridge forwarding (#148)'
          git push origin HEAD:fix/148-loopback-bridge-identity
