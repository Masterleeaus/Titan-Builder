name: Import and Patch OpenBrowser Source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-titan-builder-v2.6-deep-scan
          fetch-depth: 0

      - name: Safely inspect and extract archive when source is absent
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            echo 'Source is already expanded; skipping archive extraction.'
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import collections
          import filecmp
          import shutil
          import stat
          import tempfile
          import zipfile

          archive = Path('OpenBrowser-v0.5.0-Project-Intelligence-Port.zip')
          if not archive.is_file():
              raise SystemExit(f'Missing source archive: {archive}')

          def merge_protected(source_dir: Path, destination_dir: Path) -> None:
              destination_dir.mkdir(parents=True, exist_ok=True)
              for source_item in source_dir.rglob('*'):
                  relative = source_item.relative_to(source_dir)
                  if destination_dir.name == '.github' and relative.parts[:1] == ('workflows',):
                      print(f'Deferring archived workflow to connector-managed import: {relative}')
                      continue
                  destination_item = destination_dir / relative
                  if source_item.is_dir():
                      destination_item.mkdir(parents=True, exist_ok=True)
                      continue
                  destination_item.parent.mkdir(parents=True, exist_ok=True)
                  if destination_item.exists():
                      if destination_item.is_file() and filecmp.cmp(source_item, destination_item, shallow=False):
                          continue
                      raise SystemExit(f'Refusing protected-file conflict: {destination_item}')
                  shutil.copy2(source_item, destination_item)

          repo = Path.cwd().resolve()
          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              names = [item.filename for item in infos]
              duplicates = [name for name, count in collections.Counter(names).items() if count > 1]
              case_groups = collections.defaultdict(list)
              for name in names:
                  case_groups[name.casefold()].append(name)
              case_collisions = [group for group in case_groups.values() if len(group) > 1]

              unsafe = []
              symlinks = []
              for item in infos:
                  name = item.filename
                  parts = PurePosixPath(name).parts
                  if name.startswith('/') or '..' in parts:
                      unsafe.append(name)
                  mode = (item.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode):
                      symlinks.append(name)

              if unsafe or symlinks or duplicates or case_collisions:
                  raise SystemExit(
                      f'Unsafe archive: traversal={unsafe}, symlinks={symlinks}, '
                      f'duplicates={duplicates}, case_collisions={case_collisions}'
                  )

              roots = sorted({name.split('/', 1)[0] for name in names if name})
              if roots != ['OpenBrowser-v0.5.0']:
                  raise SystemExit(f'Unexpected archive root(s): {roots}')

              with tempfile.TemporaryDirectory(prefix='titan-builder-import-') as tmp:
                  tmp_path = Path(tmp).resolve()
                  zf.extractall(tmp_path)
                  source = tmp_path / 'OpenBrowser-v0.5.0'
                  if not source.is_dir():
                      raise SystemExit('Expected wrapper directory was not extracted')

                  for child in source.iterdir():
                      destination = repo / child.name
                      if child.name in {'.github', '.titan'}:
                          if not child.is_dir():
                              raise SystemExit(f'Protected archive entry must be a directory: {child}')
                          merge_protected(child, destination)
                          continue
                      if destination.exists():
                          if destination.name == archive.name:
                              continue
                          if destination.is_dir():
                              shutil.rmtree(destination)
                          else:
                              destination.unlink()
                      if child.is_dir():
                          shutil.copytree(child, destination)
                      else:
                          shutil.copy2(child, destination)
          PY

      - name: Apply verified repair patch once
        shell: bash
        run: |
          set -euo pipefail
          patch_file='.titan/patches/OB-001-to-OB-003-code.patch'
          if [[ ! -f "$patch_file" ]]; then
            echo 'Repair patch is not present yet.'
            exit 0
          fi
          if git apply --reverse --check "$patch_file"; then
            echo 'Repair patch is already applied.'
          elif git apply --check "$patch_file"; then
            git apply "$patch_file"
          else
            echo 'Repair patch cannot be applied cleanly.' >&2
            exit 1
          fi

      - name: Commit source or patch changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source or patch changes to commit.'
            exit 0
          fi
          git commit -m 'fix: import source and apply verified repair patch'
          git pull --rebase origin agent/fix-titan-builder-v2.6-deep-scan
          git push origin HEAD:agent/fix-titan-builder-v2.6-deep-scan
