name: Apply Verified Titan Builder Repairs

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-repairs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: titan-builder-source-repair
      cancel-in-progress: false
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-titan-builder-v2.6-deep-scan
          fetch-depth: 0

      - name: Confirm source was safely expanded
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -d browser-extension
          test -d src
          test -f OpenBrowser-v0.5.0-Project-Intelligence-Port.zip

      - name: Download, verify, and apply repairs once
        shell: bash
        env:
          PATCH_BASE_URL: https://titan-builder-repair-patches.miniup.app/patches
        run: |
          set -euo pipefail
          work_dir="$(mktemp -d)"
          trap 'rm -rf "$work_dir"' EXIT

          patches=(
            '01-OB-001-grok-routing.patch|9f87cb2aacf13524697377f1123499120bcfa6263814284f1f915a66cbd8c72c'
            '02-OB-002-project-path.patch|37ffa62e7bebfdf44b3d355993c699f3361b97e28e7167aef8760c136f165636'
            '03-OB-003-operation-order.patch|1e96fe1c5440e4a47811676534e4737b8892cbe56fcbc101db6a4ef231632399'
            '04-test-registration.patch|0875fe177e26f7df9962d5936bac73202fea1898dfcab024561c17e4be014892'
            '05-typecheck-operation-paths.patch|e15ec905fb6c9c22be6cda443a015e1f65a3413154eeaf35865069cdde7bf91f'
          )

          for item in "${patches[@]}"; do
            IFS='|' read -r patch_name expected_sha <<< "$item"
            patch_path="$work_dir/$patch_name"
            curl --fail --location --silent --show-error --retry 3 \
              "$PATCH_BASE_URL/$patch_name" \
              --output "$patch_path"

            actual_sha="$(sha256sum "$patch_path" | awk '{print $1}')"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "Checksum mismatch for $patch_name: expected $expected_sha, got $actual_sha" >&2
              exit 1
            fi

            if git apply --reverse --check "$patch_path" 2>/dev/null; then
              echo "Already applied: $patch_name"
            elif git apply --check "$patch_path"; then
              git apply "$patch_path"
              echo "Applied: $patch_name"
            else
              echo "Repair patch cannot be applied cleanly: $patch_name" >&2
              exit 1
            fi
          done

      - name: Run dependency-free repair gate
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:offline

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser-extension src package.json
          if git diff --cached --quiet; then
            echo 'Repairs are already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: apply verified Titan Builder repairs'
          git pull --rebase origin agent/fix-titan-builder-v2.6-deep-scan
          git push origin HEAD:agent/fix-titan-builder-v2.6-deep-scan
