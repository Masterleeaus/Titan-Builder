name: Apply Verified Titan Builder Repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: titan-builder-source-repair
      cancel-in-progress: false
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-titan-builder-v2.6-deep-scan
          fetch-depth: 0

      - name: Confirm source was safely expanded
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -d browser-extension
          test -d src
          test -f OpenBrowser-v0.5.0-Project-Intelligence-Port.zip

      - name: Download, verify, and apply OB-004 repair once
        shell: bash
        env:
          PATCH_URL: https://titan-builder-repair-patches.miniup.app/patches/06-OB-004-transactional-operations.patch
          PATCH_SHA256: 98e41e61064575686bf8c69e5011f2c61eb52db65c251885cfad75e1d7dac01a
        run: |
          set -euo pipefail
          patch_path="$(mktemp)"
          trap 'rm -f "$patch_path"' EXIT
          curl --fail --location --silent --show-error --retry 3 "$PATCH_URL" --output "$patch_path"
          actual_sha="$(sha256sum "$patch_path" | awk '{print $1}')"
          if [[ "$actual_sha" != "$PATCH_SHA256" ]]; then
            echo "Checksum mismatch: expected $PATCH_SHA256, got $actual_sha" >&2
            exit 1
          fi

          if git apply --reverse --check "$patch_path" 2>/dev/null; then
            echo 'OB-004 repair is already applied.'
          elif git apply --check "$patch_path"; then
            git apply "$patch_path"
            echo 'Applied OB-004 transactional operations repair.'
          else
            echo 'OB-004 repair cannot be applied cleanly.' >&2
            exit 1
          fi

      - name: Run dependency-free repair gate
        run: npm run verify:offline

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'Repair is already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: make operations stateful and transactional'
          git pull --rebase origin agent/fix-titan-builder-v2.6-deep-scan
          git push origin HEAD:agent/fix-titan-builder-v2.6-deep-scan
