name: Security and Dependency Health

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'browser-extension/package.json'
      - 'browser-extension/pnpm-lock.yaml'
      - 'scripts/check_github_workflows.py'
      - 'scripts/scan_committed_secrets.py'
      - 'scripts/tests/**'
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-policy:
    name: security-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install policy checker dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run security and workflow policy tests
        run: python -m unittest scripts.tests.test_check_github_workflows scripts.tests.test_scan_committed_secrets -v

      - name: Enforce workflow policy
        run: python scripts/check_github_workflows.py .

      - name: Scan committed text for high-confidence secrets
        continue-on-error: true
        run: |
          set +e
          python scripts/scan_committed_secrets.py . 2>&1 | tee committed-secret-scan.txt
          status=${PIPESTATUS[0]}
          {
            echo '### Committed secret scan'
            echo
            echo '```text'
            tail -n 100 committed-secret-scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Install root dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify generated catalogs and extension metadata
        run: |
          pnpm run check:skills
          pnpm run check:extension

      - name: Install browser-extension dependencies without lifecycle scripts
        working-directory: browser-extension
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit root dependencies
        continue-on-error: true
        run: |
          set +e
          pnpm audit --audit-level high 2>&1 | tee root-audit.txt
          status=${PIPESTATUS[0]}
          {
            echo '### Root dependency audit'
            echo
            echo '```text'
            tail -n 100 root-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Audit browser-extension dependencies
        continue-on-error: true
        working-directory: browser-extension
        run: |
          set +e
          pnpm audit --audit-level high 2>&1 | tee browser-extension-audit.txt
          status=${PIPESTATUS[0]}
          {
            echo '### Browser-extension dependency audit'
            echo
            echo '```text'
            tail -n 100 browser-extension-audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
