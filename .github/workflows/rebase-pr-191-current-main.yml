name: Rebase PR 191 onto current main (trigger)

on:
  push:
    branches:
      - fix/issue-116-secure-rollback
    paths:
      - .github/workflows/rebase-pr-191-current-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebase-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
      - name: Rebase exact security diff
        run: |
          cp .github/scripts/rebase-pr-191.py /tmp/rebase-pr-191.py
          git fetch origin main
          git diff --binary 51683d900f5f8958b2845ada252f468bb3aa6f6d 6efd7bccd80aea2f01128a3eeb29fa07d853ea05 -- \
            src/operations/index.ts \
            src/operations/transaction.integration.test.ts \
            src/operations/rollback-metadata.integration.test.ts \
            docs/superpowers/plans/2026-08-02-secure-rollback-revalidation.md \
            > /tmp/issue-116-final.patch
          test -s /tmp/issue-116-final.patch
          git reset --hard origin/main
          git apply --3way --index /tmp/issue-116-final.patch
          python /tmp/rebase-pr-191.py
          git add package.json src/operations/index.ts \
            src/operations/transaction.integration.test.ts \
            src/operations/rollback-metadata.integration.test.ts \
            docs/superpowers/plans/2026-08-02-secure-rollback-revalidation.md
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 5
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir browser-extension install --frozen-lockfile
      - name: Focused rollback tests
        run: pnpm exec tsx --test src/operations/transaction.integration.test.ts src/operations/rollback-metadata.integration.test.ts
      - name: Full verification
        run: |
          pnpm run verify
          pnpm --dir browser-extension run verify
      - name: Publish clean branch
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          EXPECTED_OLD_HEAD: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): revalidate rollback paths before mutation (#116)"
          auth_header=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" push \
            --force-with-lease=refs/heads/fix/issue-116-secure-rollback:${EXPECTED_OLD_HEAD} \
            origin HEAD:fix/issue-116-secure-rollback
