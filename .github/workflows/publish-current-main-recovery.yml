name: Publish current-main recovery

on:
  push:
    branches:
      - fix/current-main-verification-regressions

permissions:
  contents: write

concurrency:
  group: publish-current-main-recovery
  cancel-in-progress: false

jobs:
  repair-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: fix/current-main-verification-regressions

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Apply deterministic root recovery
        run: python scripts/repair_current_main_final.py

      - name: Reconcile companion bridge source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('browser-extension/bridge-server.ts')
          source = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one companion merge artifact, found {count}: {old[:120]!r}')
              source = source.replace(old, new, 1)

          replace_once(
              "import { existsSync, readFileSync } from 'node:fs';",
              "import { existsSync } from 'node:fs';",
          )
          replace_once(
              "import { loadWorkspaceEnvironment } from './environment.js';",
              "import { loadWorkspaceEnvironment } from './environment.js';\n"
              "export { loadWorkspaceEnvironment as loadCompanionEnvironment } from './environment.js';",
          )
          replace_once(
              'const workspaceConfigPath = loadWorkspaceEnvironment();',
              'loadWorkspaceEnvironment();',
          )
          replace_once(
              '  bridgeRequest?: typeof requestAuthenticatedBridge;\n',
              '',
          )
          replace_once(
              "  const explicit = options.databasePath ?? process.env.WORKSPACE_DB_PATH;\n"
              "  if (explicit) {\n"
              "    return path.resolve(explicit);\n"
              "  }",
              "  const configuredPath = process.env.WORKSPACE_DB_PATH;\n"
              "  const explicit = options.databasePath\n"
              "    ?? (configuredPath && configuredPath !== 'undefined' ? configuredPath : undefined);\n"
              "  if (explicit) {\n"
              "    return path.resolve(explicit);\n"
              "  }",
          )
          replace_once(
              "  const bridgeEndpoint = parseLoopbackBridgeUrl(\n"
              "    options.bridgeUrl ?? process.env.OPENBROWSER_BRIDGE_URL ?? DEFAULT_BRIDGE_URL,\n"
              "  );\n"
              "  const bridgeUrl = bridgeEndpoint.origin;\n"
              "  const bridgeToken = options.bridgeToken ?? process.env.BRIDGE_TOKEN;\n"
              "  const bridgeClient = bridgeToken\n"
              "    ? createAuthenticatedBridgeClient({ bridgeUrl, controlToken: bridgeToken })\n"
              "    : undefined;\n"
              "  const databasePath = path.resolve(\n"
              "    options.databasePath\n"
              "      ?? process.env.WORKSPACE_DB_PATH\n"
              "      ?? path.join(moduleDirectory, 'openbrowser-workspace.db'),\n"
              "  );\n"
              "  const bridgeUrl = bridgeEndpoint.origin;\n"
              "  const bridgeToken = options.bridgeToken ?? process.env.BRIDGE_TOKEN;\n"
              "  const databasePath = await resolveWorkspaceDatabasePath({ databasePath: options.databasePath });",
              "  const bridgeEndpoint = parseLoopbackBridgeUrl(\n"
              "    options.bridgeUrl ?? process.env.OPENBROWSER_BRIDGE_URL ?? DEFAULT_BRIDGE_URL,\n"
              "  );\n"
              "  const bridgeUrl = bridgeEndpoint.origin;\n"
              "  const bridgeToken = options.bridgeToken ?? process.env.BRIDGE_TOKEN;\n"
              "  const bridgeClient = bridgeToken\n"
              "    ? createAuthenticatedBridgeClient({ bridgeUrl, controlToken: bridgeToken })\n"
              "    : undefined;\n"
              "  const databasePath = await resolveWorkspaceDatabasePath({ databasePath: options.databasePath });",
          )
          replace_once(
              "    if (error instanceof WorkspaceHttpError) {\n"
              "      return reply.code(error.statusCode).send({ error: error.message });\n"
              "    }",
              "    if (error instanceof WorkspaceHttpError) {\n"
              "      return reply.code(error.statusCode).send({\n"
              "        error: error.statusCode >= 500 ? 'Workspace operation failed' : error.message,\n"
              "        detail: error.statusCode >= 500 ? error.message : undefined,\n"
              "      });\n"
              "    }",
          )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Restore verified companion lock
        run: git show 51683d900f5f8958b2845ada252f468bb3aa6f6d:browser-extension/pnpm-lock.yaml > browser-extension/pnpm-lock.yaml

      - name: Verify root package
        run: |
          pnpm install --frozen-lockfile
          pnpm run verify

      - name: Verify companion package
        run: |
          pnpm --dir browser-extension install --frozen-lockfile
          pnpm --dir browser-extension run verify

      - name: Remove one-shot recovery artifacts and verify policy
        shell: bash
        run: |
          rm -f .github/workflows/publish-current-main-recovery.yml
          rm -f scripts/repair_current_main_final.py
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
          python scripts/check_github_workflows.py .
          git diff --check

      - name: Publish verified recovery
        shell: bash
        run: |
          git config user.name "titan-builder-agent"
          git config user.email "titan-builder-agent@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): publish verified current-main recovery"
          git push origin HEAD:fix/current-main-verification-regressions
