name: Issue 119 protected branch policy red phase

on:
  pull_request:
    branches:
      - main
    paths:
      - src/security/repository-identity.ts
      - src/security/repository-policy.test.ts
      - src/workflows/agent-application.ts
      - src/workflows/agent-protected-branch.integration.test.ts
      - src/server/index.ts
      - src/server/protected-branch.integration.test.ts
      - .github/workflows/issue-119-policy-red.yml

permissions:
  contents: read

jobs:
  protected-branch-policy-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm install --frozen-lockfile

      - name: Run protected branch policy contracts
        run: pnpm exec tsx --test src/security/repository-policy.test.ts src/workflows/agent-protected-branch.integration.test.ts src/server/protected-branch.integration.test.ts
