name: Issue 119 repository identity contract

on:
  pull_request:
    branches:
      - main
    paths:
      - src/security/repository-identity.ts
      - src/security/repository-identity.test.ts
      - .github/workflows/issue-119-red.yml

permissions:
  contents: read

jobs:
  repository-identity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm install --frozen-lockfile

      - name: Run repository identity contract
        run: node --experimental-strip-types --test src/security/repository-identity.test.ts
