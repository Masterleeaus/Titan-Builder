name: Apply issue 116 verified rebuild

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-issue-116-review-fix.yml

permissions:
  contents: write

concurrency:
  group: controller-rebuild-pr-191
  cancel-in-progress: false

jobs:
  rebuild-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out rollback branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/issue-116-secure-rollback
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm expected branch head
        env:
          EXPECTED_HEAD: f59298570bb32e784b16f11bae35aa4b9bd8c6d2
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Rebuild reviewed rollback patch on current main
        run: |
          cp .github/scripts/rebuild-pr-191.py /tmp/rebuild-pr-191.py
          git fetch origin main
          git diff --binary aafa09089a02d3edb009fb422cee173529658ba7 063f0ed34ed455ed39fda8683313902b387bcbe9 -- \
            src/operations/index.ts \
            src/operations/transaction.integration.test.ts \
            src/operations/rollback-metadata.integration.test.ts \
            > /tmp/issue-116.patch
          test -s /tmp/issue-116.patch
          git reset --hard origin/main
          git apply --3way --index /tmp/issue-116.patch
          python /tmp/rebuild-pr-191.py
          git add package.json src/operations/index.ts \
            src/operations/transaction.integration.test.ts \
            src/operations/rollback-metadata.integration.test.ts
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 4

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir browser-extension install --frozen-lockfile

      - name: Run focused rollback regressions
        run: pnpm exec tsx --test src/operations/transaction.integration.test.ts src/operations/rollback-metadata.integration.test.ts

      - name: Run complete root verification
        run: pnpm run verify

      - name: Run complete companion verification
        run: pnpm --dir browser-extension run verify

      - name: Publish clean verified rollback branch
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          EXPECTED_OLD_HEAD: f59298570bb32e784b16f11bae35aa4b9bd8c6d2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): revalidate rollback paths before mutation (#116)"
          auth_header=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" push \
            --force-with-lease=refs/heads/fix/issue-116-secure-rollback:${EXPECTED_OLD_HEAD} \
            origin HEAD:fix/issue-116-secure-rollback
