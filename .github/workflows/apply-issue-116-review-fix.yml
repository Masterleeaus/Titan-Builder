name: Apply issue 116 post-commit review fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-issue-116-review-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/issue-116-secure-rollback
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Confirm expected review head and merge main
        env:
          EXPECTED_HEAD: 063f0ed34ed455ed39fda8683313902b387bcbe9
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Separate commit from post-commit bookkeeping
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/operations/index.ts')
          source = source_path.read_text()
          start_marker = "  try {\n    for (const [index, plan] of plans.entries()) {"
          end_marker = "\n}\n\nasync function resolveFileOperationPath"
          start = source.index(start_marker, source.index('export async function executePlannedOperations'))
          end = source.index(end_marker, start)
          replacement = '''  try {
            for (const [index, plan] of plans.entries()) {
              transaction.journal.status = 'applying';
              transaction.journal.activeOperation = index;
              transaction.journal.updatedAt = new Date().toISOString();
              await writeTransactionJournal(transaction);
              await verifyPreconditions(plan.preconditions);
              await applyOperation(plan, root, options.onStep);
            }

            transaction.journal.status = 'committed';
            transaction.journal.rollbackStatus = 'not_required';
            transaction.journal.activeOperation = undefined;
            transaction.journal.updatedAt = new Date().toISOString();
            await writeTransactionJournal(transaction);
          } catch (error) {
            const message = error instanceof Error ? error.message : String(error);
            const rollbackStatus = await rollbackTransaction(transaction, message);

            try {
              await appendTransactionHistory(transaction, {
                timestamp: new Date().toISOString(),
                conversationId: options.conversationId,
                mode: 'agent',
                summary: `Operation transaction failed after ${transaction.journal.activeOperation ?? 0} completed step(s)`,
                status: 'failed',
                transactionId: transaction.journal.id,
                operationCount: plans.length,
                failedOperation: transaction.journal.activeOperation,
                rollbackStatus,
                error: message,
              });
            } catch (historyError) {
              transaction.journal.error = `${message}; history write failed: ${formatUnknownError(historyError)}`;
              transaction.journal.updatedAt = new Date().toISOString();
              await writeTransactionJournal(transaction).catch(() => undefined);
            }

            throw new Error(
              `Operation transaction failed: ${message}. Rollback ${rollbackStatus === 'rolled_back' ? 'completed' : 'failed; inspect the transaction journal'}.`,
              { cause: error },
            );
          }

          const postCommitErrors: string[] = [];
          try {
            await appendTransactionHistory(transaction, {
              timestamp: new Date().toISOString(),
              conversationId: options.conversationId,
              mode: 'agent',
              summary: `Applied ${plans.length} operation(s)`,
              status: 'committed',
              transactionId: transaction.journal.id,
              operationCount: plans.length,
              rollbackStatus: 'not_required',
            });
          } catch (historyError) {
            postCommitErrors.push(`history write failed: ${formatUnknownError(historyError)}`);
          }

          try {
            const committedRoot = await assertRollbackProjectIdentity(transaction);
            const committedBackupRoot = await resolveRollbackBackupRoot(
              committedRoot,
              transaction.backupRoot,
            );
            await fs.remove(committedBackupRoot);
          } catch (cleanupError) {
            postCommitErrors.push(`backup cleanup failed: ${formatUnknownError(cleanupError)}`);
          }

          if (postCommitErrors.length > 0) {
            transaction.journal.error = `Transaction committed; ${postCommitErrors.join('; ')}`;
            transaction.journal.updatedAt = new Date().toISOString();
            await writeTransactionJournal(transaction).catch(() => undefined);
          }

          return plans;
          '''
          source_path.write_text(source[:start] + replacement + source[end:])

          test_path = Path('src/operations/transaction.integration.test.ts')
          tests = test_path.read_text()
          marker = "test('planner rejects writes through an intermediate symlink that leaves the project'"
          index = tests.index(marker)
          regression = '''test('post-commit history failure does not initiate rollback after commit', async () => {
            const projectRoot = await createProject();
            const targetPath = path.join(projectRoot, 'value.txt');
            const historyPath = path.join(projectRoot, '.openbrowser', 'history.json');
            await writeFile(targetPath, 'before\\n', 'utf8');
            await fs.ensureDir(path.dirname(historyPath));
            await writeFile(historyPath, '{"not":"an array"}', 'utf8');

            try {
              const plans = await planOperations([
                { action: 'EDIT_FILE', path: 'value.txt', content: 'after\\n' },
              ], projectRoot);

              const result = await executePlannedOperations(plans, projectRoot);
              assert.equal(result.length, 1);
              assert.equal(await readFile(targetPath, 'utf8'), 'after\\n');
              assert.equal(await readFile(historyPath, 'utf8'), '{"not":"an array"}');

              const transactionDirectory = path.join(projectRoot, '.openbrowser', 'transactions');
              const entries = await fs.readdir(transactionDirectory);
              const journalName = entries.find((name) => name.endsWith('.json'));
              assert.ok(journalName);
              assert.deepEqual(entries.filter((name) => name.endsWith('.backup')), []);

              const journal = await fs.readJson(path.join(transactionDirectory, journalName)) as {
                status?: string;
                rollbackStatus?: string;
                error?: string;
              };
              assert.equal(journal.status, 'committed');
              assert.equal(journal.rollbackStatus, 'not_required');
              assert.match(journal.error ?? '', /Transaction committed; history write failed/i);
            } finally {
              await fs.remove(projectRoot);
            }
          });

          '''
          test_path.write_text(tests[:index] + regression + tests[index:])
          PY

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm install --frozen-lockfile

      - name: Verify rollback correction
        run: |
          pnpm run typecheck
          pnpm exec tsx --test src/operations/transaction.integration.test.ts src/operations/rollback-metadata.integration.test.ts

      - name: Commit and push verified correction
        run: |
          git add src/operations/index.ts src/operations/transaction.integration.test.ts
          git commit -m "fix(operations): keep post-commit bookkeeping out of rollback (#116)"
          git push origin HEAD:fix/issue-116-secure-rollback
