name: Socket-bound bridge bootstrap

on:
  push:
    branches:
      - security/socket-bound-auth-verified

permissions:
  contents: write

concurrency:
  group: socket-bound-auth-bootstrap
  cancel-in-progress: false

jobs:
  rebuild-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out current main-based branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Copy reviewed security implementation
        shell: bash
        run: |
          set -euo pipefail
          source_commit='1bb3e27e2a78f8c68043d45d56a52221c557bac6'
          git fetch --no-tags origin security/issue-223-socket-bound-auth-final
          for path in \
            browser-extension/bridge-connection-transport.ts \
            browser-extension/bridge-connection-transport.test.ts \
            browser-extension/bridge-trust.ts \
            browser-extension/bridge-server.ts \
            browser-extension/bridge-server.test.ts \
            browser-extension/bridge-instance-pinning.test.ts \
            browser-extension/bridge-token-normalization.test.ts
          do
            git show "${source_commit}:${path}" > "${path}"
          done

      - name: Add regression test to current package scripts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'browser-extension/package.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));
          const testFile = 'bridge-connection-transport.test.ts';
          for (const scriptName of ['test', 'test:watch']) {
            const command = manifest.scripts?.[scriptName];
            if (typeof command !== 'string') {
              throw new Error(`Missing ${scriptName} script`);
            }
            if (!command.includes(testFile)) {
              manifest.scripts[scriptName] = `${command} ${testFile}`;
            }
          }
          fs.writeFileSync(file, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Install root dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm install --frozen-lockfile

      - name: Install companion dependencies
        working-directory: browser-extension
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Verify root application
        shell: bash
        run: pnpm run verify

      - name: Verify browser companion
        working-directory: browser-extension
        shell: bash
        run: pnpm run verify

      - name: Publish verified clean branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/socket-bound-auth-bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser-extension/bridge-connection-transport.ts \
            browser-extension/bridge-connection-transport.test.ts \
            browser-extension/bridge-trust.ts \
            browser-extension/bridge-server.ts \
            browser-extension/bridge-server.test.ts \
            browser-extension/bridge-instance-pinning.test.ts \
            browser-extension/bridge-token-normalization.test.ts \
            browser-extension/package.json
          git rm .github/workflows/socket-bound-auth-bootstrap.yml
          git diff --cached --check
          git commit -m 'fix(security): bind bridge authorization to verified connection (#223)'
          git push origin HEAD:security/socket-bound-auth-verified
