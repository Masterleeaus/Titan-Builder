name: Finalize companion recovery once

on:
  push:
    branches:
      - fix/current-main-recovery-final

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Activate pnpm 11.2.2
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
      - name: Repair collided companion initialization
        shell: python
        run: |
          from pathlib import Path

          path = Path('browser-extension/bridge-server.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import { existsSync, readFileSync } from 'node:fs';",
                  "import { existsSync } from 'node:fs';",
              ),
              (
                  "  bridgeAllowedPorts?: number[];\n  bridgeRequest?: typeof requestAuthenticatedBridge;\n",
                  "  bridgeAllowedPorts?: number[];\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one repair anchor, found {text.count(old)}: {old!r}')
              text = text.replace(old, new, 1)

          collided = """  const bridgeEndpoint = parseLoopbackBridgeUrl(
            options.bridgeUrl ?? process.env.OPENBROWSER_BRIDGE_URL ?? DEFAULT_BRIDGE_URL,
          );
          const bridgeUrl = bridgeEndpoint.origin;
          const bridgeToken = options.bridgeToken ?? process.env.BRIDGE_TOKEN;
          const bridgeClient = bridgeToken
            ? createAuthenticatedBridgeClient({ bridgeUrl, controlToken: bridgeToken })
            : undefined;
          const databasePath = path.resolve(
            options.databasePath
              ?? process.env.WORKSPACE_DB_PATH
              ?? path.join(moduleDirectory, 'openbrowser-workspace.db'),
          );
          const bridgeUrl = bridgeEndpoint.origin;
          const bridgeToken = options.bridgeToken ?? process.env.BRIDGE_TOKEN;
          const databasePath = await resolveWorkspaceDatabasePath({ databasePath: options.databasePath });
          """
          repaired = """  const bridgeEndpoint = parseLoopbackBridgeUrl(
            options.bridgeUrl ?? process.env.OPENBROWSER_BRIDGE_URL ?? DEFAULT_BRIDGE_URL,
          );
          const bridgeUrl = bridgeEndpoint.origin;
          const bridgeToken = options.bridgeToken ?? process.env.BRIDGE_TOKEN;
          const bridgeClient = bridgeToken
            ? createAuthenticatedBridgeClient({ bridgeUrl, controlToken: bridgeToken })
            : undefined;
          const databasePath = await resolveWorkspaceDatabasePath({ databasePath: options.databasePath });
          """
          if text.count(collided) != 1:
              raise SystemExit(f'Expected one duplicated initialization block, found {text.count(collided)}')
          path.write_text(text.replace(collided, repaired, 1), encoding='utf-8')
      - name: Regenerate companion lock from its manifest
        working-directory: browser-extension
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
          pnpm run verify
      - name: Publish verified companion repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-companion-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-extension/bridge-server.ts browser-extension/pnpm-lock.yaml .github/workflows/finalize-companion-recovery.yml
          git diff --cached --check
          git commit -m "fix(ci): reconcile companion source and lock"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:fix/current-main-recovery-final"
