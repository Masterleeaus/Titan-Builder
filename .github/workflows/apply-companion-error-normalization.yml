name: Apply companion error normalization

on:
  push:
    branches:
      - fix/issue-209-safe-error-handler

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-209-safe-error-handler
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: browser-extension/pnpm-lock.yaml
      - name: Apply type-safe error normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('browser-extension/bridge-server.ts')
          source = source_path.read_text(encoding='utf-8')

          class_block = """class WorkspaceHttpError extends Error {
            constructor(
              message: string,
              readonly statusCode: number,
            ) {
              super(message);
              this.name = 'WorkspaceHttpError';
            }
          }
          """

          helper_block = class_block + """
          export interface NormalizedWorkspaceError {
            statusCode: number;
            error: string;
            detail?: string;
          }

          export function normalizeWorkspaceError(error: unknown): NormalizedWorkspaceError {
            if (!(error instanceof Error)) {
              return {
                statusCode: 500,
                error: 'Workspace operation failed',
              };
            }

            const candidateStatus = (error as Error & { statusCode?: unknown }).statusCode;
            const statusCode = typeof candidateStatus === 'number'
              && Number.isInteger(candidateStatus)
              && candidateStatus >= 400
              && candidateStatus <= 599
              ? candidateStatus
              : 500;

            if (statusCode >= 500) {
              return {
                statusCode,
                error: 'Workspace operation failed',
                detail: error.message,
              };
            }

            return {
              statusCode,
              error: error.message,
            };
          }
          """

          old_handler = """    const statusCode = typeof error.statusCode === 'number' ? error.statusCode : 500;
              return reply.code(statusCode).send({
                error: statusCode >= 500 ? 'Workspace operation failed' : error.message,
                detail: statusCode >= 500 ? error.message : undefined,
              });
          """

          new_handler = """    const normalizedError = normalizeWorkspaceError(error);
              return reply.code(normalizedError.statusCode).send({
                error: normalizedError.error,
                ...(normalizedError.detail === undefined ? {} : { detail: normalizedError.detail }),
              });
          """

          if source.count(class_block) != 1:
              raise SystemExit('WorkspaceHttpError insertion point was not unique')
          if source.count(old_handler) != 1:
              raise SystemExit('Error-handler replacement point was not unique')

          source = source.replace(class_block, helper_block, 1)
          source = source.replace(old_handler, new_handler, 1)
          source_path.write_text(source, encoding='utf-8')
          PY
      - name: Install companion dependencies
        working-directory: browser-extension
        run: pnpm install --frozen-lockfile
      - name: Verify companion fix
        working-directory: browser-extension
        run: pnpm run verify
      - name: Commit verified implementation and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-companion-error-normalization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-extension/bridge-server.ts .github/workflows/apply-companion-error-normalization.yml
          git commit -m "fix(companion): normalize unknown Fastify errors (#209)"
          git push
