name: Finalize current-main recovery

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  repair-verify-publish:
    if: github.head_ref == 'fix/current-main-verification-regressions'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Apply deterministic source reconciliation
        run: python scripts/repair_current_main_final.py

      - name: Install root dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify root build, tests, CLI, catalogs, and extension
        run: pnpm run verify

      - name: Install companion dependencies from lockfile
        run: pnpm --dir browser-extension install --frozen-lockfile

      - name: Verify browser-extension companion
        run: pnpm --dir browser-extension run verify

      - name: Publish verified production tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          rm .github/workflows/finalize-current-main-recovery.yml
          rm scripts/repair_current_main_final.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): complete coherent current-main recovery (#284)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${HEAD_REF}"
