name: Apply Verified OB-008 Repair

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: titan-builder-ob008-repair
      cancel-in-progress: false
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-titan-builder-v2.6-deep-scan
          fetch-depth: 0

      - name: Download and verify exact OB-008 source artifact
        shell: bash
        env:
          ARTIFACT_URL: https://titan-builder-ob008-artifact.miniup.app/artifacts/ob008-repair.tar.gz
          ARTIFACT_SHA256: f2c41d5dca6dc748759f198a8fe1c445c5e86f717015c3241c8b60f952b63c0d
        run: |
          set -euo pipefail
          artifact_path="$(mktemp --suffix=.tar.gz)"
          extraction_root="$(mktemp -d)"
          trap 'rm -rf "$artifact_path" "$extraction_root"' EXIT

          curl --fail --location --silent --show-error --retry 3 "$ARTIFACT_URL" --output "$artifact_path"
          actual_sha="$(sha256sum "$artifact_path" | awk '{print $1}')"
          if [[ "$actual_sha" != "$ARTIFACT_SHA256" ]]; then
            echo "Checksum mismatch: expected $ARTIFACT_SHA256, got $actual_sha" >&2
            exit 1
          fi

          python - "$artifact_path" "$extraction_root" <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil
          import sys
          import tarfile

          archive = Path(sys.argv[1])
          extraction_root = Path(sys.argv[2]).resolve()
          repository_root = Path.cwd().resolve()
          expected = {
              '.env.example',
              'README.md',
              'scripts/install-windows.ps1',
              'scripts/release-config.test.mjs',
              'package.json',
              'src/config/bridge-security.ts',
              'src/config/bridge-security.test.ts',
              'src/server/security.ts',
              'src/server/security.test.ts',
              'src/server/operation-approvals.ts',
              'src/server/operation-approvals.test.ts',
              'src/server/index.ts',
              'src/server/workflow.integration.ts',
              'src/client/bridge-client.ts',
              'browser-extension/src/bridge-config.js',
              'browser-extension/src/bridge-config.test.mjs',
              'browser-extension/src/popup.html',
              'browser-extension/src/popup.js',
          }

          with tarfile.open(archive, 'r:gz') as tf:
              file_members = [member for member in tf.getmembers() if member.isfile()]
              names = {member.name for member in file_members}
              if names != expected:
                  raise SystemExit(f'Unexpected artifact paths: expected={sorted(expected)}, actual={sorted(names)}')
              for member in tf.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              tf.extractall(extraction_root, filter='data')

          for relative in sorted(expected):
              source = extraction_root / relative
              destination = repository_root / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
          PY

      - name: Run dependency-free repair gate
        run: npm run verify:offline

      - name: Commit verified source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .env.example \
            README.md \
            scripts/install-windows.ps1 \
            scripts/release-config.test.mjs \
            package.json \
            src/config/bridge-security.ts \
            src/config/bridge-security.test.ts \
            src/server/security.ts \
            src/server/security.test.ts \
            src/server/operation-approvals.ts \
            src/server/operation-approvals.test.ts \
            src/server/index.ts \
            src/server/workflow.integration.ts \
            src/client/bridge-client.ts \
            browser-extension/src/bridge-config.js \
            browser-extension/src/bridge-config.test.mjs \
            browser-extension/src/popup.html \
            browser-extension/src/popup.js
          if git diff --cached --quiet; then
            echo 'OB-008 repair is already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'fix: harden bridge authentication and approvals'
          git pull --rebase origin agent/fix-titan-builder-v2.6-deep-scan
          git push origin HEAD:agent/fix-titan-builder-v2.6-deep-scan
