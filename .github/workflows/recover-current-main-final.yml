name: Final current-main recovery

on:
  push:
    branches:
      - fix/current-main-verification-regressions

permissions:
  contents: write

concurrency:
  group: final-current-main-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: fix/current-main-verification-regressions

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Apply deterministic verified recovery
        shell: bash
        run: |
          git show 5b6efa9ef443f6013c9e700f583ad88b8512be3d:scripts/recover_current_main.py > scripts/recover_current_main.py
          python scripts/recover_current_main.py
          python - <<'PY'
          from pathlib import Path

          operations = Path('src/operations/index.ts')
          source = operations.read_text(encoding='utf-8')
          source = source.replace(
              'canonicalizeProjectRoot, isPathInsideProject, isReservedPath, resolveProjectPath',
              'canonicalizeProjectRoot, isReservedPath, resolveProjectPath',
              1,
          )
          operations.write_text(source, encoding='utf-8')

          registry = Path('src/tools/registry.ts')
          source = registry.read_text(encoding='utf-8')
          source = source.replace(
              "export function listToolManifests(): TitanToolManifest[] {\n  return builtinToolRegistry.manifests().map((manifest) => structuredClone(manifest));\n}",
              "export function listToolManifests(): readonly TitanToolManifest[] {\n  return builtinToolRegistry.manifests();\n}",
              1,
          )
          registry.write_text(source, encoding='utf-8')
          PY

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify root package
        run: pnpm run verify

      - name: Verify browser-extension companion
        run: |
          pnpm --dir browser-extension install --frozen-lockfile
          pnpm --dir browser-extension run verify

      - name: Remove one-shot artifacts and verify policy
        shell: bash
        run: |
          rm -f .github/workflows/recover-current-main-final.yml scripts/recover_current_main.py
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
          python scripts/check_github_workflows.py .

      - name: Publish verified recovery
        shell: bash
        run: |
          git config user.name "titan-builder-agent"
          git config user.email "titan-builder-agent@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): publish verified current-main recovery"
          git push origin HEAD:fix/current-main-verification-regressions
