name: Wire bounded ChatGPT file export

on:
  push:
    branches:
      - fix/issue-150-bounded-chatgpt-file-export

permissions:
  contents: write

concurrency:
  group: issue-150-wire-bounded-export
  cancel-in-progress: false

jobs:
  wire-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out issue branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Wire shared bounded downloader
        shell: python
        run: |
          import json
          import pathlib
          import re

          background_path = pathlib.Path('browser-extension/src/background.js')
          background = background_path.read_text(encoding='utf-8')
          import_anchor = "import { prepareOutboundJob } from './job-payload.js';\n"
          import_line = "import { fetchChatGPTFileExport } from './chatgpt-file-fetch.js';\n"
          if import_line not in background:
              if import_anchor not in background:
                  raise SystemExit('background import anchor was not found')
              background = background.replace(import_anchor, import_anchor + import_line, 1)
          background = background.replace(
              "const MAX_CHATGPT_EXPORT_BYTES = 15 * 1024 * 1024;\n",
              '',
              1,
          )
          background_pattern = re.compile(
              r"async function fetchChatGPTFile\(rawUrl\) \{.*?\n\}\n",
              re.S,
          )
          background_replacement = (
              "async function fetchChatGPTFile(rawUrl) {\n"
              "  return fetchChatGPTFileExport(rawUrl);\n"
              "}\n"
          )
          background, background_count = background_pattern.subn(
              background_replacement,
              background,
              count=1,
          )
          if background_count != 1:
              raise SystemExit(f'expected one background file handler, found {background_count}')
          background_path.write_text(background, encoding='utf-8')

          content_path = pathlib.Path('browser-extension/src/content-script.js')
          content = content_path.read_text(encoding='utf-8')
          content = content.replace(
              "const MAX_CHATGPT_EXPORT_BYTES = 15 * 1024 * 1024;\n",
              '',
              1,
          )
          content_pattern = re.compile(
              r"async function handleChatGPTFileFetch\(rawUrl\) \{.*?\n\}\n",
              re.S,
          )
          content_replacement = """async function handleChatGPTFileFetch(rawUrl) {
            if (!/^(?:chatgpt\\.com|chat\\.openai\\.com)$/.test(location.hostname)) {
              throw new Error('ChatGPT file export is available only from a ChatGPT tab.');
            }
            const url = new URL(String(rawUrl ?? ''), location.href);
            const response = await chrome.runtime.sendMessage({
              type: 'OPENBROWSER_FETCH_CHATGPT_FILE',
              url: url.href,
            });
            if (!response?.ok) {
              throw new Error(response?.error || 'The bounded ChatGPT file download failed.');
            }
            return {
              base64: response.base64,
              filename: response.filename,
              type: response.type,
              size: response.size,
            };
          }
          """
          content, content_count = content_pattern.subn(
              content_replacement,
              content,
              count=1,
          )
          if content_count != 1:
              raise SystemExit(f'expected one content file handler, found {content_count}')
          content_path.write_text(content, encoding='utf-8')

          package_path = pathlib.Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          test_command = package['scripts']['test:node']
          for test_file in [
              'browser-extension/src/chatgpt-file-fetch.test.mjs',
              'browser-extension/src/chatgpt-file-routing.test.mjs',
          ]:
              if test_file not in test_command:
                  test_command += f' {test_file}'
          package['scripts']['test:node'] = test_command
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm install --frozen-lockfile

      - name: Verify repository
        shell: bash
        run: pnpm run verify

      - name: Publish verified source changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-150-wire-bounded-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add browser-extension/src/background.js \
            browser-extension/src/content-script.js \
            browser-extension/src/chatgpt-file-fetch.js \
            browser-extension/src/chatgpt-file-fetch.test.mjs \
            browser-extension/src/chatgpt-file-routing.test.mjs \
            package.json
          git rm .github/workflows/issue-150-wire-bounded-export.yml
          git diff --cached --check
          git commit -m 'fix(security): bound ChatGPT file export downloads (#150)'
          git push origin HEAD:fix/issue-150-bounded-chatgpt-file-export
