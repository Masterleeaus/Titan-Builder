name: Repair companion recovery once

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
    paths:
      - browser-extension/package.json
      - browser-extension/pnpm-lock.yaml
      - browser-extension/bridge-server.ts
      - .github/workflows/repair-companion-final-once.yml

permissions:
  contents: write

concurrency:
  group: repair-companion-gpt56-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair-verify-publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/current-main-recovery-gpt56' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/current-main-recovery-gpt56
          fetch-depth: 0
          persist-credentials: false

      - name: Restore lock and repair exact companion contracts
        run: |
          git show 51683d900f5f8958b2845ada252f468bb3aa6f6d:browser-extension/pnpm-lock.yaml > browser-extension/pnpm-lock.yaml
          python - <<'PY'
          from pathlib import Path

          path = Path('browser-extension/bridge-server.ts')
          text = path.read_text()
          replacements = [
              (
                  "import { existsSync, readFileSync } from 'node:fs';",
                  "import { existsSync } from 'node:fs';",
              ),
              (
                  "export { parseLoopbackBridgeUrl } from './bridge-endpoint-policy.js';\n",
                  "export { parseLoopbackBridgeUrl } from './bridge-endpoint-policy.js';\n"
                  "export { loadWorkspaceEnvironment as loadCompanionEnvironment } from './environment.js';\n",
              ),
              (
                  "  bridgeRequest?: typeof requestAuthenticatedBridge;\n",
                  "",
              ),
              (
                  "  const explicit = options.databasePath ?? process.env.WORKSPACE_DB_PATH;\n",
                  "  const configuredPath = process.env.WORKSPACE_DB_PATH?.trim();\n"
                  "  const explicit = options.databasePath ?? (\n"
                  "    configuredPath && !['undefined', 'null'].includes(configuredPath.toLowerCase())\n"
                  "      ? configuredPath\n"
                  "      : undefined\n"
                  "  );\n",
              ),
              (
                  "  const databasePath = path.resolve(\n"
                  "    options.databasePath\n"
                  "      ?? process.env.WORKSPACE_DB_PATH\n"
                  "      ?? path.join(moduleDirectory, 'openbrowser-workspace.db'),\n"
                  "  );\n"
                  "  const bridgeUrl = bridgeEndpoint.origin;\n"
                  "  const bridgeToken = options.bridgeToken ?? process.env.BRIDGE_TOKEN;\n"
                  "  const databasePath = await resolveWorkspaceDatabasePath({ databasePath: options.databasePath });\n",
                  "  const databasePath = await resolveWorkspaceDatabasePath({ databasePath: options.databasePath });\n",
              ),
              (
                  "    if (error instanceof WorkspaceHttpError) {\n"
                  "      return reply.code(error.statusCode).send({ error: error.message });\n"
                  "    }\n",
                  "    if (error instanceof WorkspaceHttpError) {\n"
                  "      return reply.code(error.statusCode).send({\n"
                  "        error: error.statusCode >= 500 ? 'Workspace operation failed' : error.message,\n"
                  "        detail: error.statusCode >= 500 ? error.message : undefined,\n"
                  "      });\n"
                  "    }\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one merge artifact, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rm .github/workflows/repair-companion-final-once.yml
          git diff --check

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify companion and root
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          cd browser-extension
          pnpm install --frozen-lockfile
          pnpm run verify
          cd ..
          pnpm install --frozen-lockfile
          pnpm run verify

      - name: Publish verified final recovery
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          old_head=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add browser-extension/pnpm-lock.yaml browser-extension/bridge-server.ts .github/workflows/repair-companion-final-once.yml
          git commit -m "fix(ci): restore verified companion runtime"
          auth_header=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" push \
            --force-with-lease="refs/heads/${HEAD_REF}:${old_head}" \
            origin "HEAD:${HEAD_REF}"
