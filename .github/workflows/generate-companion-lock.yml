name: Generate verified companion recovery artifacts

on:
  pull_request:
    branches:
      - diagnostic/recovery-tree-base

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Activate pnpm 11.2.2
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
      - name: Restore and repair coherent companion security slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 33b828f01858abbb86f4d34010941114577c0f77
          git checkout 33b828f01858abbb86f4d34010941114577c0f77 -- \
            browser-extension/bridge-server.ts \
            browser-extension/package.json
          rm -f \
            browser-extension/bridge-authenticated-client.test.ts \
            browser-extension/bridge-authenticated-client.ts \
            browser-extension/bridge-endpoint-policy.ts \
            browser-extension/bridge-forwarding-security.test.ts \
            browser-extension/bridge-identity-verifier.ts
          python - <<'PY'
          from pathlib import Path

          path = Path('browser-extension/bridge-server.ts')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "import { existsSync, readFileSync } from 'node:fs';",
                  "import { existsSync } from 'node:fs';",
              ),
              ('response = await authenticatedBridgeRequest({', 'response = await requestAuthenticatedBridge({'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one companion repair anchor, found {text.count(old)}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Regenerate and verify companion
        working-directory: browser-extension
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
          pnpm run verify
      - name: Write recovery manifest
        shell: bash
        run: |
          cat > companion-recovery-manifest.txt <<'EOF'
          restore browser-extension/bridge-server.ts
          restore browser-extension/package.json
          restore browser-extension/pnpm-lock.yaml
          delete browser-extension/bridge-authenticated-client.test.ts
          delete browser-extension/bridge-authenticated-client.ts
          delete browser-extension/bridge-endpoint-policy.ts
          delete browser-extension/bridge-forwarding-security.test.ts
          delete browser-extension/bridge-identity-verifier.ts
          EOF
      - name: Upload verified companion files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-companion-recovery
          path: |
            browser-extension/bridge-server.ts
            browser-extension/package.json
            browser-extension/pnpm-lock.yaml
            companion-recovery-manifest.txt
          if-no-files-found: error
          retention-days: 1
