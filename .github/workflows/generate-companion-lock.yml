name: Generate verified companion recovery artifacts

on:
  pull_request:
    branches:
      - diagnostic/recovery-tree-base

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Activate pnpm 11.2.2
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
      - name: Repair collided companion source
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('browser-extension/bridge-server.ts')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "import { existsSync, readFileSync } from 'node:fs';",
                  "import { existsSync } from 'node:fs';",
              ),
              (
                  "  bridgeAllowedPorts?: number[];\n  bridgeRequest?: typeof requestAuthenticatedBridge;\n",
                  "  bridgeAllowedPorts?: number[];\n",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one repair anchor, found {text.count(old)}: {old!r}')
              text = text.replace(old, new, 1)

          pattern = re.compile(
              r"  const databasePath = path\.resolve\([\s\S]*?"
              r"  const databasePath = await resolveWorkspaceDatabasePath\(\{ databasePath: options\.databasePath \}\);\n"
          )
          replacement = (
              "  const databasePath = await resolveWorkspaceDatabasePath("
              "{ databasePath: options.databasePath });\n"
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one collided database initialization region, found {count}')
          path.write_text(text, encoding='utf-8')
      - name: Regenerate and verify companion
        working-directory: browser-extension
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
          pnpm run verify
      - name: Upload verified companion files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-companion-recovery
          path: |
            browser-extension/bridge-server.ts
            browser-extension/pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
