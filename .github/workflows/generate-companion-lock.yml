name: Generate verified companion recovery artifacts

on:
  pull_request:
    branches:
      - diagnostic/recovery-tree-base

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - name: Activate pnpm 11.2.2
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
      - name: Replace cwd dotenv discovery with explicit environment authority
        shell: python
        run: |
          from pathlib import Path

          path = Path('browser-extension/bridge-server.ts')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "import { config } from 'dotenv';",
                  "import { loadWorkspaceEnvironment } from './environment.js';",
              ),
              (
                  "config();",
                  "const workspaceConfigPath = loadWorkspaceEnvironment();",
              ),
              (
                  "console.log(`OpenBrowser Workspace companion listening on http://${host}:${port}`);",
                  "console.log(`OpenBrowser Workspace companion listening on http://${host}:${port} (config: ${workspaceConfigPath ?? 'process environment only'})`);",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one environment integration anchor, found {text.count(old)}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Regenerate and verify companion
        working-directory: browser-extension
        shell: bash
        run: |
          set -euo pipefail
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
          pnpm run verify
      - name: Write recovery manifest
        shell: bash
        run: |
          cat > companion-recovery-manifest.txt <<'EOF'
          replace browser-extension/bridge-server.ts
          replace browser-extension/bridge-server.test.ts
          replace browser-extension/bridge-connection-transport.ts
          replace browser-extension/bridge-connection-transport.test.ts
          replace browser-extension/bridge-trust.ts
          replace browser-extension/bridge-trust.test.ts
          replace browser-extension/bridge-instance-pinning.test.ts
          replace browser-extension/bridge-token-normalization.test.ts
          replace browser-extension/environment.ts
          replace browser-extension/environment.test.ts
          replace browser-extension/package.json
          replace browser-extension/tsconfig.json
          replace browser-extension/pnpm-lock.yaml
          delete browser-extension/bridge-authenticated-client.test.ts
          delete browser-extension/bridge-authenticated-client.ts
          delete browser-extension/bridge-endpoint-policy.ts
          delete browser-extension/bridge-forwarding-security.test.ts
          delete browser-extension/bridge-identity-verifier.ts
          EOF
      - name: Upload verified companion files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-companion-recovery
          path: |
            browser-extension/bridge-server.ts
            browser-extension/bridge-server.test.ts
            browser-extension/bridge-connection-transport.ts
            browser-extension/bridge-connection-transport.test.ts
            browser-extension/bridge-trust.ts
            browser-extension/bridge-trust.test.ts
            browser-extension/bridge-instance-pinning.test.ts
            browser-extension/bridge-token-normalization.test.ts
            browser-extension/environment.ts
            browser-extension/environment.test.ts
            browser-extension/package.json
            browser-extension/tsconfig.json
            browser-extension/pnpm-lock.yaml
            companion-recovery-manifest.txt
          if-no-files-found: error
          retention-days: 1
