name: Publish verified current-main recovery

on:
  push:
    branches:
      - fix/current-main-recovery-gpt56

permissions:
  contents: write

concurrency:
  group: publish-current-main-recovery-gpt56
  cancel-in-progress: true

jobs:
  repair-verify-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/current-main-recovery-gpt56
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic repairs
        run: |
          python scripts/repair_current_main_final.py
          python scripts/repair_recovery_compatibility.py
          git diff --check

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Verify root package
        run: |
          pnpm install --frozen-lockfile
          pnpm run verify

      - name: Verify companion package
        run: |
          pnpm --dir browser-extension install --frozen-lockfile
          pnpm --dir browser-extension run verify

      - name: Remove recovery machinery and verify policy
        run: |
          rm -f .github/workflows/repair-companion-final-once.yml
          rm -f .github/workflows/publish-current-main-recovery-push.yml
          rm -f scripts/repair_current_main_final.py
          rm -f scripts/repair_recovery_compatibility.py
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
          python scripts/check_github_workflows.py .
          git diff --check

      - name: Publish verified production tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): publish verified isolated recovery"
          git push origin HEAD:fix/current-main-recovery-gpt56
