name: Apply issue 284 CI baseline repair

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
    paths:
      - pnpm-lock.yaml
      - .github/workflows/issue-284-lockfile-repair.yml
      - .github/workflows/apply-issue-119.yml
      - .github/workflows/apply-issue-24-controller.yml
      - .github/workflows/retry-issue-119-publish.yml

permissions:
  contents: write

concurrency:
  group: issue-284-ci-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair-verify-publish:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/issue-284-restore-ci-baseline' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/issue-284-restore-ci-baseline
          fetch-depth: 0
          persist-credentials: false

      - name: Repair exactly one duplicated lockfile mapping
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('pnpm-lock.yaml')
          text = path.read_text()
          block = (
              "  braces@3.0.3:\n"
              "    resolution: {integrity: sha512-yQbXgO/OSZVD2IsiLlro+7Hf6Q18EJrKSEsdoMzKePKXct3gvD8oLcOQdIzGupr5Fj+EDe8gO/lxc1BzfMpxvA==}\n"
              "    engines: {node: '>=8'}\n\n"
          )
          if text.count(block) != 2:
              raise SystemExit(f'expected exactly two duplicate braces mappings, found {text.count(block)}')
          duplicate = block + block
          if text.count(duplicate) != 1:
              raise SystemExit('duplicate braces mappings are not one adjacent pair')
          path.write_text(text.replace(duplicate, block, 1))
          PY
          rm .github/workflows/issue-284-lockfile-repair.yml
          git diff --check

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Verify policy and repository
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.2
          python scripts/check_github_workflows.py .
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm install --frozen-lockfile
          pnpm run verify

      - name: Commit and publish verified repair
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          old_head=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/issue-284-lockfile-repair.yml
          git commit -m "fix(ci): restore verifiable repository baseline (#284)"
          auth_header=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" push \
            --force-with-lease="refs/heads/${HEAD_REF}:${old_head}" \
            origin "HEAD:${HEAD_REF}"
