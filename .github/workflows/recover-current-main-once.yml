name: Recover current main once

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  reconcile-and-verify:
    if: github.head_ref == 'fix/current-main-verification-regressions'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Reconcile incomplete source merges
        run: |
          python scripts/recover_current_main.py
          python - <<'PY'
          from pathlib import Path

          operations = Path('src/operations/index.ts')
          source = operations.read_text(encoding='utf-8')
          source = source.replace(
              'canonicalizeProjectRoot, isPathInsideProject, isReservedPath, resolveProjectPath',
              'canonicalizeProjectRoot, isReservedPath, resolveProjectPath',
              1,
          )
          operations.write_text(source, encoding='utf-8')

          registry = Path('src/tools/registry.ts')
          source = registry.read_text(encoding='utf-8')
          old = """export function listToolManifests(): TitanToolManifest[] {
            return builtinToolRegistry.manifests().map((manifest) => structuredClone(manifest));
          }
          """
          new = """export function listToolManifests(): readonly TitanToolManifest[] {
            return Object.freeze(
              builtinToolRegistry.manifests().map((manifest) => structuredClone(manifest)),
            );
          }
          """
          if source.count(old) != 1:
            raise SystemExit('Expected exactly one public tool manifest list implementation')
          registry.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install root dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify root package
        run: pnpm run verify

      - name: Verify browser-extension companion
        run: |
          pnpm --dir browser-extension install --frozen-lockfile
          pnpm --dir browser-extension run verify

      - name: Verify workflow policy
        run: |
          python -m pip install --disable-pip-version-check --no-input pyyaml
          python scripts/check_github_workflows.py .

      - name: Publish verified reconciliation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          rm .github/workflows/recover-current-main-once.yml scripts/recover_current_main.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: reconcile current-main verification regressions (#284)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${HEAD_REF}"
