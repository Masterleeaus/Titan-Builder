name: Agent branch maintenance

on:
  push:
    branches:
      - agent/fix-tb-deep-106-bridge-forwarding
    paths:
      - .github/workflows/agent-branch-maintenance.yml

permissions:
  contents: write

jobs:
  apply-compatibility-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-tb-deep-106-bridge-forwarding

      - name: Enable pnpm
        run: corepack enable

      - name: Apply guarded source and manifest edits
        shell: python
        run: |
          from pathlib import Path
          import json

          manifest_path = Path('package.json')
          manifest = json.loads(manifest_path.read_text())
          current_cors = manifest['dependencies'].get('@fastify/cors')
          if current_cors != '^9.0.1':
              raise SystemExit(f'unexpected @fastify/cors version: {current_cors!r}')
          manifest['dependencies']['@fastify/cors'] = '^11.2.0'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')

          server_path = Path('browser-extension/bridge-server.ts')
          source = server_path.read_text()
          old = """    const statusCode = typeof error.statusCode === 'number' ? error.statusCode : 500;
              return reply.code(statusCode).send({
                error: statusCode >= 500 ? 'Workspace operation failed' : error.message,
                detail: statusCode >= 500 ? error.message : undefined,
              });"""
          new = """    const errorRecord = typeof error === 'object' && error !== null
                ? error as Record<string, unknown>
                : {};
              const statusCode = typeof errorRecord.statusCode === 'number'
                ? errorRecord.statusCode
                : 500;
              const message = error instanceof Error ? error.message : String(error);
              return reply.code(statusCode).send({
                error: statusCode >= 500 ? 'Workspace operation failed' : message,
                detail: statusCode >= 500 ? message : undefined,
              });"""
          if source.count(old) != 1:
              raise SystemExit('expected Fastify error-handler block was not found exactly once')
          server_path.write_text(source.replace(old, new))

      - name: Regenerate lockfile without lifecycle scripts
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Verify targeted typechecks
        run: |
          pnpm run typecheck
          pnpm --dir browser-extension run typecheck

      - name: Commit generated changes and remove maintenance workflow
        run: |
          rm .github/workflows/agent-branch-maintenance.yml
          git config user.name "titan-builder-agent"
          git config user.email "titan-builder-agent@users.noreply.github.com"
          git add package.json pnpm-lock.yaml browser-extension/bridge-server.ts .github/workflows/agent-branch-maintenance.yml
          git commit -m "fix: align Fastify 5 compatibility"
          git push origin HEAD:agent/fix-tb-deep-106-bridge-forwarding
