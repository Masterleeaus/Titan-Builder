name: Verify Titan Builder

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-linux:
    name: verify-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install root dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify root build, tests, CLI, and extension
        run: pnpm run verify

      - name: Install browser-extension dependencies from lockfile
        working-directory: browser-extension
        run: pnpm install --frozen-lockfile

      - name: Verify browser-extension companion
        working-directory: browser-extension
        run: pnpm run verify

  verify-windows:
    name: verify-windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install root dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify root build, tests, CLI, and extension
        run: pnpm run verify

      - name: Install browser-extension dependencies from lockfile
        working-directory: browser-extension
        run: pnpm install --frozen-lockfile

      - name: Verify browser-extension companion
        working-directory: browser-extension
        run: pnpm run verify

  workflow-policy:
    name: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install policy checker dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run repository policy tests
        run: python -m unittest scripts.tests.test_check_github_workflows scripts.tests.test_scan_committed_secrets -v

      - name: Enforce workflow policy
        run: python scripts/check_github_workflows.py .

  required-ci:
    name: required-ci
    if: always()
    needs:
      - verify-linux
      - verify-windows
      - workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report required job results
        run: |
          echo "verify-linux=${{ needs.verify-linux.result }}"
          echo "verify-windows=${{ needs.verify-windows.result }}"
          echo "workflow-policy=${{ needs.workflow-policy.result }}"

      - name: Enforce required job success
        shell: bash
        run: |
          if [[ "${{ needs.verify-linux.result }}" != "success" || \
                "${{ needs.verify-windows.result }}" != "success" || \
                "${{ needs.workflow-policy.result }}" != "success" ]]; then
            echo "One or more required CI jobs did not succeed." >&2
            exit 1
          fi
