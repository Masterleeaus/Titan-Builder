name: Verify OpenBrowser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify build, tests, CLI, and extension
        run: pnpm run verify
