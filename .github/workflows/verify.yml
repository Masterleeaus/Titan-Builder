name: Verify Titan Builder

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repair-current-main-gpt56:
    name: repair-current-main-gpt56
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/current-main-recovery-gpt56' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/current-main-recovery-gpt56
          fetch-depth: 0
          persist-credentials: false

      - name: Repair root contracts
        run: python scripts/repair_current_main_final.py

      - name: Restore lock and repair companion contracts
        shell: bash
        run: |
          git show 51683d900f5f8958b2845ada252f468bb3aa6f6d:browser-extension/pnpm-lock.yaml > browser-extension/pnpm-lock.yaml
          python - <<'PY'
          from pathlib import Path

          path = Path('browser-extension/bridge-server.ts')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "import { existsSync, readFileSync } from 'node:fs';",
                  "import { existsSync } from 'node:fs';",
              ),
              (
                  "export { parseLoopbackBridgeUrl } from './bridge-endpoint-policy.js';\n",
                  "export { parseLoopbackBridgeUrl } from './bridge-endpoint-policy.js';\n"
                  "export { loadWorkspaceEnvironment as loadCompanionEnvironment } from './environment.js';\n",
              ),
              (
                  "const workspaceConfigPath = loadWorkspaceEnvironment();",
                  "loadWorkspaceEnvironment();",
              ),
              (
                  "  bridgeRequest?: typeof requestAuthenticatedBridge;\n",
                  "",
              ),
              (
                  "  const explicit = options.databasePath ?? process.env.WORKSPACE_DB_PATH;\n",
                  "  const configuredPath = process.env.WORKSPACE_DB_PATH?.trim();\n"
                  "  const explicit = options.databasePath ?? (\n"
                  "    configuredPath && !['undefined', 'null'].includes(configuredPath.toLowerCase())\n"
                  "      ? configuredPath\n"
                  "      : undefined\n"
                  "  );\n",
              ),
              (
                  "  const databasePath = path.resolve(\n"
                  "    options.databasePath\n"
                  "      ?? process.env.WORKSPACE_DB_PATH\n"
                  "      ?? path.join(moduleDirectory, 'openbrowser-workspace.db'),\n"
                  "  );\n"
                  "  const bridgeUrl = bridgeEndpoint.origin;\n"
                  "  const bridgeToken = options.bridgeToken ?? process.env.BRIDGE_TOKEN;\n"
                  "  const databasePath = await resolveWorkspaceDatabasePath({ databasePath: options.databasePath });\n",
                  "  const databasePath = await resolveWorkspaceDatabasePath({ databasePath: options.databasePath });\n",
              ),
              (
                  "    if (error instanceof WorkspaceHttpError) {\n"
                  "      return reply.code(error.statusCode).send({ error: error.message });\n"
                  "    }\n",
                  "    if (error instanceof WorkspaceHttpError) {\n"
                  "      return reply.code(error.statusCode).send({\n"
                  "        error: error.statusCode >= 500 ? 'Workspace operation failed' : error.message,\n"
                  "        detail: error.statusCode >= 500 ? error.message : undefined,\n"
                  "      });\n"
                  "    }\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one merge artifact, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Verify root package
        run: |
          pnpm install --frozen-lockfile
          pnpm run verify

      - name: Verify companion package
        run: |
          pnpm --dir browser-extension install --frozen-lockfile
          pnpm --dir browser-extension run verify

      - name: Remove recovery machinery and enforce workflow policy
        shell: bash
        run: |
          git show origin/main:.github/workflows/verify.yml > .github/workflows/verify.yml
          rm -f .github/workflows/repair-companion-final-once.yml
          rm -f scripts/repair_current_main_final.py
          python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
          python scripts/check_github_workflows.py .
          git diff --check

      - name: Publish verified production tree
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          old_head=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): publish verified isolated recovery"
          auth_header=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth_header" push \
            --force-with-lease="refs/heads/${HEAD_REF}:${old_head}" \
            origin "HEAD:${HEAD_REF}"

  verify-linux:
    name: verify-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install root dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify root build, tests, CLI, and extension
        run: pnpm run verify

      - name: Install browser-extension dependencies from lockfile
        working-directory: browser-extension
        run: pnpm install --frozen-lockfile

      - name: Verify browser-extension companion
        working-directory: browser-extension
        run: pnpm run verify

  verify-windows:
    name: verify-windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install root dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify root build, tests, CLI, and extension
        run: pnpm run verify

      - name: Install browser-extension dependencies from lockfile
        working-directory: browser-extension
        run: pnpm install --frozen-lockfile

      - name: Verify browser-extension companion
        working-directory: browser-extension
        run: pnpm run verify

  workflow-policy:
    name: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install policy checker dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run repository policy tests
        run: python -m unittest scripts.tests.test_check_github_workflows scripts.tests.test_scan_committed_secrets -v

      - name: Enforce workflow policy
        run: python scripts/check_github_workflows.py .

  required-ci:
    name: required-ci
    if: always()
    needs:
      - verify-linux
      - verify-windows
      - workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report required job results
        run: |
          echo "verify-linux=${{ needs.verify-linux.result }}"
          echo "verify-windows=${{ needs.verify-windows.result }}"
          echo "workflow-policy=${{ needs.workflow-policy.result }}"

      - name: Enforce required job success
        shell: bash
        run: |
          if [[ "${{ needs.verify-linux.result }}" != "success" || \
                "${{ needs.verify-windows.result }}" != "success" || \
                "${{ needs.workflow-policy.result }}" != "success" ]]; then
            echo "One or more required CI jobs did not succeed." >&2
            exit 1
          fi
