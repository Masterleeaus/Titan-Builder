name: Verify Titan Builder

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-linux:
    name: verify-linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install root dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify root build, tests, CLI, and extension
        run: pnpm run verify

      - name: Install browser-extension dependencies from lockfile
        working-directory: browser-extension
        run: pnpm install --frozen-lockfile

      - name: Verify browser-extension companion
        working-directory: browser-extension
        run: pnpm run verify

  verify-windows:
    name: verify-windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install root dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify root build, tests, CLI, and extension
        run: pnpm run verify

      - name: Install browser-extension dependencies from lockfile
        working-directory: browser-extension
        run: pnpm install --frozen-lockfile

      - name: Verify browser-extension companion
        working-directory: browser-extension
        run: pnpm run verify

  workflow-policy:
    name: workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install policy checker dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Run workflow policy tests
        run: python -m unittest scripts.tests.test_check_github_workflows -v

      - name: Enforce workflow policy
        run: python scripts/check_github_workflows.py .

  required-ci:
    name: required-ci
    if: always()
    needs:
      - verify-linux
      - verify-windows
      - workflow-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report required job results
        run: |
          echo "verify-linux=${{ needs.verify-linux.result }}"
          echo "verify-windows=${{ needs.verify-windows.result }}"
          echo "workflow-policy=${{ needs.workflow-policy.result }}"

      - name: Enforce required job success
        shell: bash
        run: |
          if [[ "${{ needs.verify-linux.result }}" != "success" || \
                "${{ needs.verify-windows.result }}" != "success" || \
                "${{ needs.workflow-policy.result }}" != "success" ]]; then
            echo "One or more required CI jobs did not succeed." >&2
            exit 1
          fi
