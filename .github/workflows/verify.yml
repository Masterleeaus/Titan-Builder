name: Verify OpenBrowser

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-issue-116-patch:
    name: apply issue 116 patch
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/issue-116-rollback-path-containment'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply guarded transaction patch
        run: node scripts/apply-issue-116-rollback-patch.mjs

      - name: Restore workflow and remove temporary patch machinery
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/verify.yml
          rm -f scripts/apply-issue-116-rollback-patch.mjs
          rm -f .github/workflows/apply-issue-116-rollback-patch.yml

      - name: Commit patched transaction engine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(security): revalidate rollback mutations"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify root build, tests, CLI, and extension
        run: pnpm run verify

      - name: Verify extension workspace companion
        working-directory: browser-extension
        run: pnpm run verify
