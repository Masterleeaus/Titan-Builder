name: Reconcile verified source subsystems

on:
  push:
    branches:
      - fix/current-main-verification-regressions

permissions:
  contents: write

concurrency:
  group: reconcile-current-main-source
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: fix/current-main-verification-regressions

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Activate pnpm 11.2.2
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Fetch independently verified subsystem heads
        shell: bash
        run: |
          git fetch --no-tags origin \
            pull/157/head:refs/remotes/origin/recovery-context \
            pull/257/head:refs/remotes/origin/recovery-operations \
            pull/264/head:refs/remotes/origin/recovery-project \
            pull/267/head:refs/remotes/origin/recovery-runtime \
            pull/268/head:refs/remotes/origin/recovery-bridge \
            pull/29/head:refs/remotes/origin/recovery-skills \
            pull/18/head:refs/remotes/origin/recovery-tools

      - name: Restore coherent source boundaries
        shell: bash
        run: |
          restore() {
            local ref="$1"
            local file="$2"
            git show "$ref:$file" > "$file"
          }

          restore origin/recovery-context src/context/directory-tree.ts
          restore origin/recovery-context src/context/file-context.ts
          restore origin/recovery-operations src/operations/index.ts
          restore origin/recovery-project src/security/project-path.ts
          restore origin/recovery-runtime src/diagnostics/install-doctor.ts
          restore origin/recovery-runtime src/server/session-store.ts
          restore origin/recovery-bridge src/server/browser-workflow-routes.ts
          restore origin/recovery-bridge src/server/index.ts

          restore origin/recovery-skills src/skills/dispatcher.ts
          restore origin/recovery-skills src/skills/handlers.ts
          restore origin/recovery-skills src/skills/index.ts
          restore origin/recovery-skills src/skills/loader.ts
          restore origin/recovery-skills src/skills/manifest.ts
          restore origin/recovery-skills src/skills/schema-validation.ts

          restore origin/recovery-tools src/tools/index.ts
          restore origin/recovery-tools src/tools/registry.ts

      - name: Verify reconciled TypeScript boundary
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run typecheck

      - name: Remove controller and publish coherent source recovery
        shell: bash
        run: |
          rm -f .github/workflows/reconcile-current-main-source.yml
          git config user.name "titan-builder-agent"
          git config user.email "titan-builder-agent@users.noreply.github.com"
          git add src .github/workflows
          git commit -m "fix(ci): restore coherent verified source subsystems"
          git push origin HEAD:fix/current-main-verification-regressions
