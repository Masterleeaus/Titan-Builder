name: Reconcile issue 146 with current main

on:
  pull_request:
    branches:
      - main

concurrency:
  group: issue-146-current-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reconcile-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: fix/issue-146-integrity-current-main-v2
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconcile completed implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp src/workflows/browser-run-store.ts /tmp/browser-run-store-current.ts
          git fetch origin fix/issue-146-integrity-bound-run-artifacts main

          set +e
          git merge --no-commit --no-ff origin/fix/issue-146-integrity-bound-run-artifacts
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            actual_conflicts="$(git diff --name-only --diff-filter=U | sort)"
            expected_conflicts="$(printf '%s\n' package.json src/workflows/browser-run-store.ts | sort)"
            if [ "$actual_conflicts" != "$expected_conflicts" ]; then
              echo "Unexpected conflict set:"
              printf '%s\n' "$actual_conflicts"
              exit 1
            fi
          fi

          git checkout --ours package.json
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          script = package['scripts']['test:node']
          required = [
              'src/workflows/browser-run-integrity.test.ts',
              'src/workflows/browser-run-integrity-recovery.test.ts',
          ]
          for test_file in required:
              if test_file not in script:
                  script += f' {test_file}'
          package['scripts']['test:node'] = script
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')
          PY

          git checkout --theirs src/workflows/browser-run-store.ts
          cp /tmp/browser-run-store-current.ts src/workflows/browser-run-store-core.ts
          git add package.json src/workflows/browser-run-store.ts src/workflows/browser-run-store-core.ts

          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          expected_files="$(printf '%s\n' \
            docs/superpowers/plans/2026-08-02-integrity-bound-run-artifacts.md \
            package.json \
            src/workflows/browser-run-integrity-recovery.test.ts \
            src/workflows/browser-run-integrity.test.ts \
            src/workflows/browser-run-integrity.ts \
            src/workflows/browser-run-recovery.test.ts \
            src/workflows/browser-run-store-core.ts \
            src/workflows/browser-run-store.ts \
            tsconfig.json | sort)"
          actual_files="$(git diff --name-only --cached | sort)"
          if [ "$actual_files" != "$expected_files" ]; then
            echo "Unexpected staged files:"
            printf '%s\n' "$actual_files"
            exit 1
          fi
          git diff --check --cached
      - name: Activate pnpm 11.2.2
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate
          pnpm --version
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused integrity regressions
        run: pnpm exec tsx --test src/workflows/browser-run-integrity.test.ts src/workflows/browser-run-integrity-recovery.test.ts src/workflows/browser-run-recovery.test.ts
      - name: Verify root application
        run: pnpm run verify
      - name: Install companion dependencies
        working-directory: browser-extension
        run: pnpm install --frozen-lockfile
      - name: Verify browser-extension companion
        working-directory: browser-extension
        run: pnpm run verify
      - name: Commit verified candidate and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-146-current-main.yml
          git add -A
          git commit -m "fix(workflows): integrity-bind recovered run artifacts (#146)"

          expected_files="$(printf '%s\n' \
            docs/superpowers/plans/2026-08-02-integrity-bound-run-artifacts.md \
            package.json \
            src/workflows/browser-run-integrity-recovery.test.ts \
            src/workflows/browser-run-integrity.test.ts \
            src/workflows/browser-run-integrity.ts \
            src/workflows/browser-run-recovery.test.ts \
            src/workflows/browser-run-store-core.ts \
            src/workflows/browser-run-store.ts \
            tsconfig.json | sort)"
          actual_files="$(git diff --name-only origin/main...HEAD | sort)"
          if [ "$actual_files" != "$expected_files" ]; then
            echo "Unexpected final branch diff:"
            printf '%s\n' "$actual_files"
            exit 1
          fi
          git push origin HEAD:fix/issue-146-integrity-current-main-v2
