version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      fastify-server:
        applies-to: version-updates
        patterns:
          - fastify
          - '@fastify/*'
          - pino
        update-types:
          - minor
          - patch
      typescript-tooling:
        applies-to: version-updates
        patterns:
          - typescript
          - tsx
          - vitest
          - '@types/*'
        update-types:
          - minor
          - patch
      runtime-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /browser-extension
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      include: scope
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
      workspace-server:
        applies-to: version-updates
        patterns:
          - fastify
          - better-sqlite3
          - ws
          - zod
        update-types:
          - minor
          - patch
      typescript-tooling:
        applies-to: version-updates
        patterns:
          - typescript
          - tsx
          - vitest
          - prettier
          - '@types/*'
        update-types:
          - minor
          - patch
      runtime-dependencies:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Australia/Melbourne
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(actions)'
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
